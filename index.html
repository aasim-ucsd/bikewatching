<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bikewatching</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

  <!-- Mapbox GL JS CSS -->
  <link
    href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="global.css" />
  <link rel="stylesheet" href="map.css" />

  <script src="map.js" type="module"></script>
</head>
<body>
  <header>
    <h1>🚴🏼‍♀️ Bikewatching</h1>

    <!-- Step 5.1: time filter slider -->
    <label>
      Filter by time:
      <input id="time-slider" type="range" min="-1" max="1440" value="-1" />
      <time id="selected-time"></time>
      <em id="any-time">(any time)</em>
    </label>
  </header>

  <p>
    Bike traffic at Bluebikes stations in Boston and Cambridge (March 2024).
    Circle size shows how many trips start or end at a station; color shows
    whether more bikes leave or arrive there.
  </p>

  <!-- Step 1.2 + 3.2: the map, with an SVG layer on top for the stations -->
  <div id="map">
    <svg></svg>
  </div>

  <!-- Step 6.2: legend -->
  <div class="legend">
    <div style="--departure-ratio: 1">More departures</div>
    <div style="--departure-ratio: 0.5">Balanced</div>
    <div style="--departure-ratio: 0">More arrivals</div>
  </div>
</body>
</html>
